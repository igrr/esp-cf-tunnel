name: 'CI'

on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: '0 1 * * 6'

jobs:
  pre-commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev ninja-build
          pip install pytest pycapnp h2
      - name: Build
        run: |
          cmake -S test_apps/host -B test_apps/host/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCFT_FETCH_NGHTTP2=ON -DCFT_WERROR=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
          cmake --build test_apps/host/build
      - name: Run tests
        run: pytest -v test_apps/host

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        idf_ver: ["release-v5.4", "release-v5.5", "release-v6.0", "latest"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Build example
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf_ver }}
          target: esp32p4
          path: examples/tunnel_ethernet
